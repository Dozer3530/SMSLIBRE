name: CI

# Builds the parts that do not need an SMS install. SmsLibre.Core is
# self-contained, so it and its tests run on any GitHub runner. The Import
# project (and its integration tests) reference SMS's ADAPT DLLs, which only
# exist on a machine with SMS installed, so they are excluded from CI here.

# Manual trigger only. Hosted runners were not being allocated to this private
# repo ("job was not acquired by Runner of type hosted"), so every push produced
# a red X for a job that never actually ran. The build and tests are verified
# locally before each push; run this from the Actions tab when a clean-room
# Linux check is actually wanted.
on:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build SmsLibre.Core
        run: dotnet build sidecar/src/SmsLibre.Core -c Release

      - name: Run Core tests
        run: dotnet test sidecar/tests/SmsLibre.Core.Tests -c Release
